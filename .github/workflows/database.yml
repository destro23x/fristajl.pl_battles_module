# Provisions the application-level database users (application_user_fristajl
# and migration_user_fristajl) on the shared RDS instance. Both are
# IAM-authenticated (members of the rds_iam role, no password) - only the
# RDS admin (master) user's password (generated by Terraform, stored in SSM)
# is still needed here.
name: Database provisioning

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "infrastructure/lambda/db-user-provisioner/**"
  #     - ".github/workflows/database.yml"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  OIDC_AWS_ROLE_TERRAFORM: ${{ secrets.OIDC_AWS_ROLE_TERRAFORM }}
  LAMBDA_FUNCTION_NAME: fristajl-db-user-provisioner

concurrency:
  group: database-provisioning-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  provision-db-users:
    name: Create application_user_fristajl/migration_user_fristajl
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.OIDC_AWS_ROLE_TERRAFORM }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Provision application_user_fristajl and migration_user_fristajl via Lambda
        run: |
          set -euo pipefail

          # The Lambda is in a VPC with no NAT gateway or VPC interface
          # endpoints, so it cannot reach the RDS/SSM/KMS APIs itself - an
          # empty payload makes it hang on DescribeDBInstances/GetParameter
          # until it hits its timeout. This runner has normal internet/AWS
          # API access, so resolve everything here and pass it in the
          # invoke payload instead (the Lambda only needs to reach RDS over
          # the VPC ENI in that case).
          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier shared-infra-db \
            --query 'DBInstances[0].{host:Endpoint.Address,port:Endpoint.Port,adminDatabase:DBName,adminUser:MasterUsername}' \
            --output json)

          ADMIN_PASSWORD=$(aws ssm get-parameter --name "rds-admin-user-password" --with-decryption --query 'Parameter.Value' --output text)

          jq -n \
            --argjson rds "$RDS_ENDPOINT" \
            --arg adminPassword "$ADMIN_PASSWORD" \
            '$rds + {database: "fristajl", adminPassword: $adminPassword}' \
            > payload.json

          aws lambda invoke \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload file://payload.json \
            --log-type Tail \
            response.json > invoke-metadata.json

          echo "--- Lambda response ---"
          cat response.json
          echo

          if jq -e '.FunctionError' invoke-metadata.json > /dev/null 2>&1; then
            echo "Lambda invocation failed:" >&2
            jq -r '.LogResult // empty' invoke-metadata.json | base64 -d >&2 || true
            exit 1
          fi

          if jq -e '.errorMessage' response.json > /dev/null 2>&1; then
            echo "Lambda returned an error:" >&2
            cat response.json >&2
            exit 1
          fi
