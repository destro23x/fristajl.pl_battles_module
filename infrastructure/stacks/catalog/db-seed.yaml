# yaml-language-server: $schema=https://atmos.tools/schemas/atmos/atmos-manifest/1.0/atmos-manifest.json

components:
  terraform:
    db-seed-task:
      metadata:
        component: fristajl-pl-db-seed-task
      vars:
        family: fristajl-db-seed
        execution_role_name: fristajl-db-seed-execution-role
        cpu: 256
        memory: 512
        region: eu-central-1
        # Placeholder only - the seed workflow always registers a new task
        # definition revision with the current backend image tag before
        # running the task.
        image: "811046139456.dkr.ecr.eu-central-1.amazonaws.com/fristajl-backend:latest"

        db_host: !terraform.state shared-infra-remote-state .db_instance_address
        db_port: !terraform.state shared-infra-remote-state .db_instance_port
        db_name: "fristajl"
        db_user: "application_user_fristajl"
        rds_db_connect_arn: !terraform.state shared-infra-remote-state .rds_db_connect_arn_application_user_fristajl
        # fristajl only has a single admin dashboard user, no separate
        # moderator role.
        admin_password_parameter_arn: !terraform.state portal-admin-password .parameter_arn

        # Reuses the db-migrator task's security group - identical network
        # requirements (egress to shared PostgreSQL + HTTPS), so no
        # dedicated SG is needed.
        subnet_ids: !terraform.state shared-infra-remote-state .public_subnets
        security_group_id: !terraform.state security-groups .migrator_security_group_id
